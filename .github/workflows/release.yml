name: Create Release on Tag Push

on:
  push:
    tags:
      - 'v*'  # 匹配 v3.2.3-beta1, v1.0.0 等

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于校验 tag 是否在 master 上

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if git merge-base --is-ancestor "${{ github.ref_name }}" origin/master; then
            echo "Tag ${{ github.ref_name }} 在 master 分支上，继续发布。"
          else
            echo "::error::Tag ${{ github.ref_name }} 不在 master 分支上，拒绝创建 Release（请先合并到 master 再打 Tag）。"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}  # Release 名直接用 tag（不带 "Release " 前缀）
          generate_release_notes: true  # 自动生成 Commit 变更日志
          prerelease: ${{ contains(github.ref_name, '-') }}  # 带后缀自动设为 Pre-release

  build-windows:
    # tag 校验通过且 Release 创建后才打包，避免无效构建
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gen_version.py 需要完整 tag 历史推导版本号

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Build exe (CI mode)
        run: |
          $env:CI_MODE = "1"
          cmd /c "build.bat"

      - name: Verify built version matches tag
        shell: pwsh
        run: |
          $ver = (Select-String -Path __about__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v','V')
          Write-Output "Built __version__=$ver | tag=$tag"
          if ($ver -ne $tag) {
            Write-Output "::warning::Built version ($ver) differs from tag ($tag) — 发布与 build 版本不一致"
          }

      - name: Upload exe to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/KorabliParagrams.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
