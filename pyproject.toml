[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wows-paragrams-unpack"
dynamic = ["version"]
description = "World of Warships / Mir Korabli 游戏数据分析工具"
readme = "README.md"
license = { file = "LICENSE.Apache-2.0" }
authors = [{ name = "walksQAQ" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*", "models*", "services*", "ui*", "utils*", "data_extractor*", "presenters*", "uncode_assets*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
# tag 命名采用 PEP 440 预发布后缀（-betaN / -rcN / -aN），setuptools-scm 默认可解析；
# 历史非 PEP 440 tag（v3.2.2-test2 / v3.2.2-fix 等）由 gen_version.py 的 git 回退兜底。
